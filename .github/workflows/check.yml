name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:native-sdk
  native:
    # Keep macOS 15 checks available during hosted arm64 capacity constraints.
    # Local release validation also covers arm64; all native steps remain unchanged.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash scripts/check-native.sh
      - run: node --import tsx scripts/check-socket-host.mjs
      - run: node --import tsx scripts/check-todo-native.mjs --socket
      - run: node --import tsx scripts/check-governance-native.mjs --socket
      - run: node --import tsx scripts/check-question-native.mjs --socket
      - run: node --import tsx scripts/check-mission-decisions-native.mjs --socket
      - run: node --import tsx scripts/check-mission-decisions-native.mjs --typed --socket
      - run: node --import tsx scripts/check-intercom-relations-native.mjs --socket
      - run: node --import tsx scripts/check-code-progress-native.mjs --socket
      - run: swift build -c release --jobs 2
# No deployment, model provider, credential, global extension install or main bootstrap.
